version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - starvault_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build: ./core
    restart: on-failure
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    networks:
      - starvault_network
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build: ./gateway
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - CORE_URL=http://core:8080
    networks:
      - starvault_network
    depends_on:
      - core

networks:
  starvault_network:
    driver: bridge

volumes:
  postgres_data:
