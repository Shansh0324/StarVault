version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starvault_dev}
      POSTGRES_DB: ${POSTGRES_DB:-starvault_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  core:
    build: ./core
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
