version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-starvault_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starvault} -d ${POSTGRES_DB:-starvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build: ./core
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - NATS_URL=nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  nats:
    image: nats:2.10-alpine
    command: "-js"
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data

  gateway:
    build: ./gateway
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - CORE_URL=http://core:8080
    depends_on:
      - core

volumes:
  postgres_data:
  nats_data:
