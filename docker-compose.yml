version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-starvault_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starvault} -d ${POSTGRES_DB:-starvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build: ./core
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
    depends_on:
      pgbouncer:
        condition: service_started
      nats:
        condition: service_started
      redis:
        condition: service_started

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p2
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-starvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-starvault_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  nats:
    image: nats:2.10-alpine
    command: "-js"
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data

  gateway:
    build: ./gateway
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - CORE_URL=http://core:8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - core
      - redis

volumes:
  postgres_data:
  nats_data:
